apply plugin: 'com.android.application'

android {
    namespace 'com.playground.sdlraylib'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.playground.sdlraylib'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DPLATFORM=Android',
                          '-DANDROID_STL=c++_static',
                          '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384'
                cppFlags ''
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {}
        release { minifyEnabled false }
    }
}
